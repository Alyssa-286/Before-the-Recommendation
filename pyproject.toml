[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "before-the-recommendation"
version = "0.1.0"
description = "Deterministic research instrument for storefront-cue shopping-agent audits"
requires-python = ">=3.11"
dependencies = [
  "python-dotenv>=1.0,<2",
  "numpy>=2.5",
  "pandas>=3.0",
  "statsmodels>=0.15",
  "matplotlib>=3.11",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
